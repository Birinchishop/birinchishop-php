name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - name: Lint
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests (dependency-free runner)
        run: php tests/run.php
      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit
